services:
  db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: calsafe-db
    environment:
      - SQLD_NODE=primary
    volumes:
      - sqld-data:/var/lib/sqld
    ports:
      # LAN access for local development and scripts (not exposed publicly).
      # Remove this if the DB should only be reachable inside compose.
      - "8080:8080"
    restart: unless-stopped

  app:
    # Built locally on first deploy (`up --build`).
    image: calsafe-app:latest
    container_name: calsafe-app
    build:
      context: .
      target: runner
    environment:
      - LIBSQL_URL=http://db:8080
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - default
      - proxy

  # One-off jobs (setup, import, refresh). Examples:
  #   docker compose --profile tools run --rm importer scripts/setup-db.ts
  #   docker compose --profile tools run --rm importer scripts/import-ccrs.ts --years=2024,2025,2026 --data-dir=/cache
  importer:
    build:
      context: .
      target: tools
    # Always rebuild on run, so cron and one-offs never use a stale image.
    pull_policy: build
    environment:
      - LIBSQL_URL=http://db:8080
    volumes:
      - ccrs-cache:/cache
    profiles:
      - tools

networks:
  # Attach your Nginx Proxy Manager deployment to this network, then point a
  # proxy host at http://calsafe-app:3000 (pinned via container_name, so the
  # hostname never changes). Fallback: forward NPM to <server-lan-ip>:3000.
  proxy:
    name: proxy
    external: true

volumes:
  sqld-data:
  ccrs-cache:
